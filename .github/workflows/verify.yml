name: verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.changes.outputs.go }}
      docker: ${{ steps.changes.outputs.docker }}
      helm: ${{ steps.changes.outputs.helm }}
      actions: ${{ steps.changes.outputs.actions }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed components
        uses: dorny/paths-filter@v4.0.3
        id: changes
        with:
          filters: |
            go:
              - '**/*.go'
              - '**/testdata/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yaml'
              - '.github/actions/go-*/*.yaml'
              - '.github/actions/verify/go/**'
            helm:
              - 'charts/**'
              - '.yamllint'
              - '.github/actions/helm-*/*.yaml'
              - '.github/actions/verify/helm/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'
              - '.hadolint.yaml'
              - 'buildinfo/*.sh'
              - '.github/actions/docker-*/*.yaml'
              - '.github/actions/verify/docker/**'
            actions:
              - '.github/actions/**'
              - '.github/workflows/**'
              - '.github/dependabot.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/verify/go

  docker:
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >>"${GITHUB_ENV}"
      - uses: ./.github/actions/verify/docker
        with:
          image: ${{ env.IMAGE_NAME }}
          load: false

  helm:
    needs: changes
    if: >-
      needs.changes.outputs.go == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.helm == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Set image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >>"${GITHUB_ENV}"
      - name: Build test image
        uses: ./.github/actions/docker-build
        with:
          tags: ${{ env.IMAGE_NAME }}
          push: false
          load: true
      - uses: ./.github/actions/verify/helm
        with:
          image: ${{ env.IMAGE_NAME }}

  actions:
    needs: changes
    if: needs.changes.outputs.actions == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/verify/actionlint

  verification:
    if: always()
    needs: [changes, go, docker, helm, actions]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful selected checks
        env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.go.result }}
          DOCKER: ${{ needs.docker.result }}
          HELM: ${{ needs.helm.result }}
          ACTIONS: ${{ needs.actions.result }}
        run: |
          for result in "${CHANGES}" "${GO}" "${DOCKER}" "${HELM}" "${ACTIONS}"; do
            [[ "${result}" == "success" || "${result}" == "skipped" ]] || exit 1
          done
