name: auto-merge

# Enable auto-merge only after CodeQL has completed successfully for the PR.
# Other required checks remain enforced by GitHub's auto-merge mechanism.
on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-pr:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr_author="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.user.login')"
          pr_head_sha="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          pr_head_ref="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.ref')"
          is_auto_release="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq 'any(.labels[].name; . == "auto-release")')"

          if [[ "${pr_head_sha}" != "${TESTED_SHA}" ]]; then
            echo "The PR changed after this verification run; skipping merge."
            exit 0
          fi

          if [[ "${pr_author}" != "${REPOSITORY_OWNER}" && "${pr_author}" != "dependabot[bot]" ]] &&
            [[ "${pr_author}" != "github-actions[bot]" || "${is_auto_release}" != "true" ]]; then
            echo "PR author is not eligible for automatic merging."
            exit 0
          fi

          # Merge the PR
          merge_args=("${PR_NUMBER}" --repo "${REPOSITORY}" --auto --merge)
          [[ "${pr_head_ref}" == release-* ]] && merge_args+=(--delete-branch)
          gh pr merge "${merge_args[@]}"
