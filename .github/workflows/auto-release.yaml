name: auto-release

on:
  schedule:
    - cron: "23 23 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Calculate the release without creating a pull request
        type: boolean
        default: false

concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with release history
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.AUTO_RELEASE_TOKEN || github.token }}
      - name: Prepare release pull request
        uses: ./.github/actions/auto-release
        with:
          token: ${{ secrets.AUTO_RELEASE_TOKEN || github.token }}
          dry-run: ${{ inputs.dry-run || false }}
