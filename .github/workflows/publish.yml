name: "publish"
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      publish-docker:
        type: boolean
        required: false
        default: true
      publish-helm:
        type: boolean
        required: false
        default: true
      app-version:
        type: string
        required: false
        default: ""
      release-tag:
        description: Create a GitHub release for this tag after all publications succeed
        type: string
        required: false
        default: ""
env:
  REGISTRY: ghcr.io
  PLATFORMS: "linux/amd64,linux/arm64/v8"
  CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
jobs:
  docker:
    if: inputs.publish-docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write
    steps:
      # Checkout
      - name: changes
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - name: image-name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
      - uses: ./.github/actions/docker-setup
        with:
          platforms: ${{ env.PLATFORMS }}
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern={{version}},value=${{ inputs.app-version }},enable=${{ inputs.app-version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.app-version }},enable=${{ inputs.app-version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.app-version }},enable=${{ inputs.app-version != '' }}
            type=raw,value=latest,enable=${{ inputs.app-version != '' }}
      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - uses: ./.github/actions/docker-build
        id: build-and-push
        with:
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          load: false
          platforms: ${{ env.PLATFORMS }}
      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes {}@${{ steps.build-and-push.outputs.digest }}
  helm:
    if: inputs.publish-helm
    # depending on default permission settings for your org (contents being read-only or read-write for workloads), you will have to add permissions
    # see: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#modifying-the-permissions-for-the-github_token
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          mark_as_latest: false
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"
  release:
    needs: [docker, helm]
    if: >-
      inputs.release-tag != '' &&
      needs.docker.result == 'success' &&
      needs.helm.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
