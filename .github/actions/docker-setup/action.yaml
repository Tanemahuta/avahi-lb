name: docker-setup
description: "sets up docker"
inputs:
  platforms:
    required: false
    default: ""
    description: "platforms to be setup, if not default"
runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4.2.0
      with:
        platforms: ${{ inputs.platforms }}
    - name: Setup Docker buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        platforms: ${{ inputs.platforms }}
