name: docker-build
description: "builds and optionally pushes a docker image"
inputs:
  tags:
    required: true
    description: "tags to be built"
  push:
    required: false
    default: "false"
    description: "true if to push the image"
  load:
    required: false
    default: "true"
    description: "true if to load the image"
  platforms:
    required: false
    default: "linux/amd64"
    description: "platforms to be built"
  version:
    required: false
    description: "version embedded in the image"
outputs:
  digest:
    description: "digest of the built image"
    value: ${{ steps.docker-build.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Set up Docker builder
      uses: ./.github/actions/docker-setup
      with:
        platforms: ${{ inputs.platforms }}
    - name: Resolve checked-out commit
      id: source
      shell: bash
      run: echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"
    # Build and push Docker image with Buildx (don't push on PR)
    # https://github.com/docker/build-push-action
    - name: Build docker image
      id: docker-build
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        load: ${{ inputs.load }}
        push: ${{ inputs.push }}
        platforms: ${{ inputs.platforms }}
        build-args: |
          VERSION=${{ inputs.version || github.ref_name }}
          COMMIT_SHA=${{ steps.source.outputs.sha }}
        tags: ${{ inputs.tags }}
        cache-from: type=gha
        cache-to: type=gha,mode=max,ignore-error=true
